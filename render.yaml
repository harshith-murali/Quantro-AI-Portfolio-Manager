services:
  - type: web
    name: quantro-api
    runtime: node
    rootDir: ai-portfolio-manager/backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRY
        value: 30m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGIN
        sync: false
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MARKET_DATA_MAX_STALENESS_DAYS
        value: "10"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BYPASS_MARKET_HOURS
        sync: false
