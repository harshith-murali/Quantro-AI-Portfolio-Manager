name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-portfolio-manager/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-portfolio-manager/backend/package-lock.json
      - run: npm ci
      - run: npx prisma format --check
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-portfolio-manager/quantro-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-portfolio-manager/quantro-landing/package-lock.json
      - run: npm ci
      - run: npm run build
